---
# Default-deny ingress for every pod in this namespace, then explicitly allow
# only the namespaces that actually talk to Postgres/PgBouncer (home, media,
# monitoring for the exporter, and database itself). Closes the lateral-movement
# path where any compromised pod anywhere in the cluster previously had a
# direct line to the shared Postgres cluster. CNI is Cilium, which enforces
# standard NetworkPolicy; egress is intentionally left unrestricted here to
# keep this a minimal first policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: database
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-known-clients
  namespace: database
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: home
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
