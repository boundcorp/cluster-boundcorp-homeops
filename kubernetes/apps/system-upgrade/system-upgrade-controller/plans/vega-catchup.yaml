---
# TEMPORARY (2026-11-24): idle catch-up of vega only, one minor per commit,
# v1.27.3 -> v1.28.15 -> v1.29.15 -> v1.30.14. Lee approved Nov 24 18:42 UTC.
# Remove this file once vega is on the cluster version.
# - selects vega only; the agent Plan keeps excluding vega.
# - no cordon/drain on purpose: SUC sets Unschedulable=false after a successful
#   job only when cordon or drain is set (handle_batch.go), so vega stays
#   cordoned between minors and is uncordoned by hand after the last one.
# - no prepare step: k3s-upgrade's "prepare server" waits until the server
#   version equals this Plan's version, which never happens while catching up.
# - no renovate marker: this version is stepped by hand.
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: vega-catchup
  namespace: system-upgrade
spec:
  version: "v1.29.15+k3s1"
  serviceAccountName: system-upgrade
  concurrency: 1
  nodeSelector:
    matchExpressions:
      - {key: kubernetes.io/hostname, operator: In, values: ["vega"]}
      - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
  tolerations:
    - {key: node.kubernetes.io/unschedulable, operator: Exists, effect: NoSchedule}
  upgrade:
    image: rancher/k3s-upgrade
