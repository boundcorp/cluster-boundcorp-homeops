---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: agent
  namespace: system-upgrade
spec:
  # renovate: datasource=github-releases depName=k3s-io/k3s
  version: "v1.27.3+k3s1"
  serviceAccountName: system-upgrade
  concurrency: 1
  # cordon-only (Lee, 2026-11-23): no drain, pods keep running through the k3s
  # restart (KillMode=process). two 16 GiB workers can't absorb each other's drain.
  # SUC uncordons the node after a successful job.
  # if a drain block comes back, every duration in it must be a string ("900s"):
  # suc >= v0.16.3 decodes an int into IntOrString int32 and stops listing Plans.
  cordon: true
  nodeSelector:
    matchExpressions:
      - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
      # vega is out of the upgrade campaign (hangs under load, stays cordoned)
      - {key: kubernetes.io/hostname, operator: NotIn, values: ["vega"]}
  prepare:
    image: rancher/k3s-upgrade
    args: ["prepare", "server"]
  upgrade:
    image: rancher/k3s-upgrade
