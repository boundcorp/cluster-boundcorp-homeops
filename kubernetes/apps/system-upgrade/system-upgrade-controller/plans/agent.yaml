---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: agent
  namespace: system-upgrade
spec:
  # renovate: datasource=github-releases depName=k3s-io/k3s
  version: "v1.33.13+k3s2"
  serviceAccountName: system-upgrade
  concurrency: 1
  # cordon-only (Lee, 2026-11-23): no drain, pods keep running through the k3s
  # restart (KillMode=process). two 16 GiB workers can't absorb each other's drain.
  # SUC uncordons the node after a successful job.
  # if a drain block comes back, every duration in it must be a string ("900s"):
  # suc >= v0.16.3 decodes an int into IntOrString int32 and stops listing Plans.
  cordon: true
  # pause between agents: when a node's job completes SUC uncordons it at once,
  # but labels it with the plan hash only after this delay, and with
  # concurrency 1 the next node's job is created only after that label. gives
  # the upgraded node 5 min to settle before the next one is cordoned and its
  # kubelet restarts. not part of the plan hash, so adding it is inert.
  # hop procedure also gates per node via nodeSelector, see docs/k3s-upgrade-plan.md.
  postCompleteDelay: "300s"
  nodeSelector:
    matchExpressions:
      - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
      # Hop 6 gate: admit ziti first; vega next, nova (SQL primary) last.
      - {key: kubernetes.io/hostname, operator: In, values: ["ziti", "vega"]}
  prepare:
    image: rancher/k3s-upgrade
    args: ["prepare", "server"]
  upgrade:
    image: rancher/k3s-upgrade
