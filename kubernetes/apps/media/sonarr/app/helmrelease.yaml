---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: &app sonarr
  namespace: media
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 1.5.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    controller:
      annotations:
        reloader.stakater.com/auto: "true"
    image:
      repository: ghcr.io/home-operations/sonarr
      tag: 4.0.20.3012@sha256:1f19eb5e0f421418c1a956bbe01310a0141423afe28bd9a4b1dcb8629ff2bce2
    env:
      SONARR__INSTANCE_NAME: Sonarr
      SONARR__APPLICATION_URL: "https://{{ .Release.Name }}.${SECRET_PRIVATE_DOMAIN}"
      SONARR__LOG_LEVEL: info
      SONARR__DATABASE_USER:
        valueFrom:
          secretKeyRef:
            name: postgres-pguser-sonarr
            key: user
      SONARR__DATABASE_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: postgres-pguser-sonarr
            key: password
      SONARR__DATABASE_HOST:
        valueFrom:
          secretKeyRef:
            name: postgres-pguser-sonarr
            key: host

    service:
      main:
        ports:
          http:
            port: 8989
    probes:
      startup:
        enabled: true
        custom: true
        spec:
          tcpSocket:
            port: 8989
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 60
          timeoutSeconds: 5
    ingress:
      main:
        enabled: true
        ingressClassName: nginx
        annotations:
          hajimari.io/icon: mdi:television-classic
        hosts:
          - host: &host "{{ .Release.Name }}.${SECRET_PRIVATE_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - *host
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: "OnRootMismatch"
      supplementalGroups:
        - 100
    persistence:
      config:
        enabled: true
        mountPath: /config
        storageClass: nfs-titan-nvme
      media:
        enabled: true
        mountPath: /media
        existingClaim: slushmedia-data
    resources:
      requests:
        cpu: 10m
        memory: 250Mi
      limits:
        memory: 2000Mi
