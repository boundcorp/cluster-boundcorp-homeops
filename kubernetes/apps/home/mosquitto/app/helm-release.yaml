---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: mosquitto
  namespace: home
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 1.5.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
  values:
    image:
      repository: docker.io/library/eclipse-mosquitto
      tag: 2.1.2-alpine
    command:
      - sh
      - -c
      - |
        # mosquitto 2.1.x refuses to open the password file if it's a symlink,
        # which is exactly how Kubernetes mounts Secret volumes. Copy to a
        # real file first.
        set -e
        mkdir -p /tmp/mosquitto-config
        cp /configinc/mqtt.conf /configinc/mosquitto_pwd /tmp/mosquitto-config/
        chmod 0440 /tmp/mosquitto-config/mqtt.conf /tmp/mosquitto-config/mosquitto_pwd
        sed -i 's#/configinc/#/tmp/mosquitto-config/#' /tmp/mosquitto-config/mqtt.conf
        exec mosquitto -c /tmp/mosquitto-config/mqtt.conf
    env:
      TZ: "${TIMEZONE}"
    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false
    service:
      main:
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: mqtt.${SECRET_PRIVATE_DOMAIN}
          io.cilium/lb-ipam-ips: ${SVC_MOSQUITTO_ADDR}
        externalTrafficPolicy: Cluster
        ports:
          http:
            enabled: false
          mqtt:
            enabled: true
            port: 1883
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: Always
    auth:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: mosquitto
    persistence:
      data:
        enabled: true
        existingClaim: mosquitto-config-v1
      configinc:
        enabled: true
        type: custom
        volumeSpec:
          secret:
            secretName: mosquitto
            defaultMode: 0440
